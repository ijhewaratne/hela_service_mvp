name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy-v0_2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/v0_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi uvicorn pydantic httpx pytest
      - run: HELA_DEMO_MODE=1 python -m pytest -q

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: hela_owner
          POSTGRES_PASSWORD: hela_owner_dev_only
          POSTGRES_DB: hela
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hela_owner -d hela" --health-interval 3s --health-timeout 3s --health-retries 40
      redis:
        image: redis:7.4.1-alpine
        ports: ['56379:6379']
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create runtime role and test database (mirrors infra/docker/postgres-init)
        env:
          PGPASSWORD: hela_owner_dev_only
          HELA_PG_APP_PASSWORD: hela_app_dev_only
          POSTGRES_USER: hela_owner
          POSTGRES_DB: hela
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          export PGHOST=127.0.0.1 PGPORT=55432
          bash ../../infra/docker/postgres-init/01-roles-and-databases.sh
      - name: Start MinIO (service containers cannot pass a server command)
        run: |
          docker run -d --name minio -p 127.0.0.1:59000:9000 \
            -e MINIO_ROOT_USER=hela_dev_s3 -e MINIO_ROOT_PASSWORD=hela_dev_s3_secret_only \
            cgr.dev/chainguard/minio@sha256:aea6c163749e1caca37f907976dcf337177ddf5f558808f2aa591618fd3a6eef \
            server /data --address :9000
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:59000/minio/health/live && break; sleep 1; done
      - name: Start the key service (OpenBao transit, dev mode, in memory)
        run: |
          docker run -d --name openbao --cap-add IPC_LOCK -p 127.0.0.1:58200:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID=hela-dev-root-token-only openbao/openbao:2.4.3 \
            server -dev -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:58200/v1/sys/health && break; sleep 1; done
      - run: python -m pip install -e '.[test,dev]'
      - run: HELA_S3_BUCKET=hela-evidence-test python -m hela.cli init-storage
      - run: ruff check hela migrations tests
      - run: HELA_REQUIRE_KEY_SERVICE=1 python -m pytest
      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable
      - name: SBOM (CycloneDX)
        run: cyclonedx-py environment -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: services/api/sbom.cdx.json

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit   # dev toolchain too: the dev server is network-exposed while running

  mobile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [hela_core, customer, provider]
    defaults:
      run:
        working-directory: apps/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and unit-test the Prometheus alert rules
        working-directory: infra/monitoring/prometheus
        run: |
          docker run --rm -v "$PWD":/w:ro -w /w --entrypoint promtool prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD":/w:ro -w /w --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml
      - name: Unit-test the log shipping pipeline (redaction)
        working-directory: infra/deploy/logging
        run: |
          docker run --rm -v "$PWD":/w:ro -e HELA_LOG_SINK_TOKEN=ci timberio/vector:0.46.1-alpine validate --no-environment /w/vector.yaml
          docker run --rm -v "$PWD":/w:ro -e HELA_LOG_SINK_TOKEN=ci timberio/vector:0.46.1-alpine test /w/vector.yaml /w/vector-test.yaml

  deploy-skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and schema-check the Kubernetes skeleton
        run: |
          kubectl kustomize infra/deploy/kubernetes/overlays/staging > rendered.yaml
          docker run --rm -v "$PWD":/w:ro ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /w/rendered.yaml
          kubectl kustomize infra/deploy/logging > logging.yaml
          docker run --rm -v "$PWD":/w:ro ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /w/logging.yaml
      - name: Build the images (not pushed)
        run: |
          docker build -t hela-api:ci services/api
          docker build --build-arg VITE_API_BASE=https://api.example.invalid -t hela-admin:ci apps/admin

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Semgrep (rule packs only; no login, no metrics)
        run: |
          pip install semgrep==1.136.0
          semgrep scan --metrics=off --error \
            --config p/python --config p/secrets --config p/dockerfile --config p/kubernetes --config p/typescript \
            --exclude node_modules --exclude dist --exclude build --exclude .venv \
            services infra apps/admin/src apps/admin/Dockerfile
