# Workers claim jobs with SKIP LOCKED, so more replicas are safe. Liveness is watched through the worker
# heartbeat alert (HelaWorkerHeartbeatMissing) rather than an HTTP probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hela-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: hela-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hela-worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: hela-api
          command: [python, -m, hela.worker]
          envFrom:
            - configMapRef: {name: hela-config}
            - secretRef: {name: hela-secrets}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
