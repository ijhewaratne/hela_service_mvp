apiVersion: apps/v1
kind: Deployment
metadata:
  name: hela-admin
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: hela-admin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hela-admin}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101          # the scratch volumes must be writable by nginx
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: admin
          image: hela-admin
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: HELA_API_ORIGIN, value: https://api.example.invalid}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:   # nginx renders its config from the template at start-up and needs scratch space
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          emptyDir: {sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hela-admin
spec:
  selector: {app.kubernetes.io/name: hela-admin}
  ports: [{name: http, port: 8080, targetPort: http}]
