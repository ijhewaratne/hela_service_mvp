# Run once per release, before rolling out the API and worker, with the owner (DDL) credentials. The runtime
# role in hela-secrets cannot change the schema. Several migrations are irreversible (0005): take a backup first.
apiVersion: batch/v1
kind: Job
metadata:
  name: hela-migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: hela-migrate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: hela-api
          command: [alembic, upgrade, head]
          envFrom:
            - secretRef: {name: hela-migration}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
