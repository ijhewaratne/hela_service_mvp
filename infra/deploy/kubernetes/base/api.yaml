apiVersion: apps/v1
kind: Deployment
metadata:
  name: hela-api
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: hela-api}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hela-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: hela-api
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: hela-config}
            - secretRef: {name: hela-secrets}
          env:
            - {name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/metrics}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hela-api
spec:
  selector: {app.kubernetes.io/name: hela-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hela-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hela-api}
