[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hela-service-synthetic-mvp"
version = "0.2.0"
description = "Synthetic demonstration of eligibility-first service dispatch for Hela Service. NOT production deployable."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hela*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
