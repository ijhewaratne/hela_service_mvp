# Static admin console. The image entrypoint fills in ${HELA_API_ORIGIN} (envsubst of defined variables only).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ${HELA_API_ORIGIN}; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cache-Control "no-store" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location /healthz { access_log off; default_type text/plain; return 200 "ok"; }
  location / { try_files $uri /index.html; }
}
