[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hela-api"
version = "1.0.0.dev0"
description = "Hela Service R1 API (synthetic local development only; not approved for real users)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "redis>=5.0,<6",
  "pyjwt>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "pyotp>=2.9,<3",
  "cryptography>=50,<52",
  "boto3>=1.35,<2",
  "python-multipart>=0.0.12,<1",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
dev = ["ruff>=0.6,<1", "pip-audit>=2.7,<3", "cyclonedx-bom>=5,<8", "locust>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hela*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["multiprocess: real OS-process concurrency and crash tests (slower)"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "S101", "S608"]  # FastAPI Depends defaults; asserts in tests; SQL built only from fixed model keys

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501", "S603", "S607", "S311"]  # tests launch our own processes; synthetic load data
"migrations/*" = ["E501"]
